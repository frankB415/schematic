<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>demo5 — PI-Regelkreis mit PT1</title>
<link rel="stylesheet" href="/schematic/schematicBlock/schematicBlock.css">
<link rel="stylesheet" href="/schematic/demo.css">
<link rel="stylesheet" href="/schematic/signalBlock/signalBlock.css">
</head>
<body class="demo5">

<h1>demo5 — PI-Regelkreis · Sollwertsprung bei t = 1 s</h1>

<div class="layout">

  <!-- Schematic -->
  <div id="schematic-wrap">
    <div id="schematic-label">Blockschaltbild</div>
    <div id="schematic">
    </div>
  </div>

  <!-- Plot -->
  <div id="plot-wrap">
    <div id="plot-label">
      Zeitverlauf
      <span class="legend-item"><span class="legend-dot" style="background:#f0c040"></span>Sollwert w</span>
      <span class="legend-item"><span class="legend-dot" style="background:#60c0ff"></span>Istwert y (PT1)</span>
      <span class="legend-item"><span class="legend-dot" style="background:#c084fc"></span>Stellgröße u (PI)</span>
    </div>
    <canvas id="plot-canvas"></canvas>
  </div>

</div>

<!-- Controls -->
<div id="controls">
  <button id="btn-start" class="active">⏵ Läuft</button>
  <button id="btn-reset">↺ Reset</button>
  <div class="ctrl-group">
    <label>Kp</label>
    <input type="number" id="in-kp" value="2" step="0.1" min="0">
  </div>
  <div class="ctrl-group">
    <label>Ki</label>
    <input type="number" id="in-ki" value="0.5" step="0.1" min="0">
  </div>
  <div class="ctrl-group">
    <label>T (PT1)</label>
    <input type="number" id="in-T" value="2" step="0.1" min="0.01">
  </div>
  <div class="ctrl-group">
    <label>w₀→w₁</label>
    <input type="number" id="in-w0" value="0" step="0.1"> →
    <input type="number" id="in-w1" value="1" step="0.1">
  </div>
  <span id="t-display">t = 0.000 s</span>
</div>

<script src="/schematic/schematicBlock/schematicBlock.js"></script>
<script src="/schematic/labeledBlock/labeledBlock.js"></script>
<script src="/schematic/signalBlock/signalBlock.js"></script>
<script src="/schematic/simulator/baseSim.js"></script>
<script src="/schematic/simulator/signalSim.js"></script>
<script src="/schematic/signalBlock/setpointBlock.js"></script>
<script src="/schematic/signalBlock/sumBlock.js"></script>
<script src="/schematic/signalBlock/piBlock.js"></script>
<script src="/schematic/signalBlock/pt1Block.js"></script>
<script src="/electricalWire/electricalWire.js"></script>
<script src="/schematic/signalBlock/signalWire.js"></script>

<script>
// ── Blöcke ──────────────────────────────────────────────────────────────────

const SCH = document.getElementById('schematic');
const DT  = 0.05;   // Simulationsschritt 50ms

// Hauptpfad y=110: Setpoint → Σ → PI
// Rückpfad  y=240: PT1 liegt unter PI, Eingang rechts, Ausgang links
const setpoint = new SetpointBlock('W',  { value0: 0, value1: 1, jumpTime: 1.0 }, { x: 75,  y: 100 });
const sum      = new SumBlock     ('Σ',  { sign1: 1, sign2: -1 },                  { x: 195, y: 100 });
const pi       = new PIBlock      ('PI', { kp: 2.0, ki: 0.5 },                      { x: 330, y: 100 });
const pt1      = new PT1Block     ('PT1',{ K: 1.0, T: 2.0 },                        { x: 330, y: 270, mirrored: true });
//const pt1      = new PT1Block     ('PT1',{ K: 1.0, T: 2.0 },                        { x: 330, y: 270, mirrored: false });
console.log('[debug] pt1 after constructor: _x=', pt1._x, '_y=', pt1._y, '_imageH=', pt1._imageH);

[setpoint, sum, pi, pt1].forEach(b => b.render(SCH));

// Debug: Connector-Positionen nach erstem Layout
requestAnimationFrame(() => {
    const rect = SCH.getBoundingClientRect();
    [
        [setpoint, 'sp'],
        [sum,      'sum'],
        [pi,       'pi'],
        [pt1,      'pt1'],
    ].forEach(([block, id]) => {
        const img = block._imageDiv;
        if (!img) return;
        const r = img.getBoundingClientRect();
        console.log(`[layout] ${id}: image centre x=${Math.round(r.left - rect.left + r.width/2)} y=${Math.round(r.top - rect.top + r.height/2)}  size ${Math.round(r.width)}x${Math.round(r.height)}  style.top=${img.style.top} style.left=${img.style.left} _x=${block._x} _y=${block._y} _imageH=${block._imageH}`);
        img.querySelectorAll('.sb-connector').forEach(dot => {
            const dr = dot.getBoundingClientRect();
            const cx = Math.round(dr.left - rect.left + dr.width/2);
            const cy = Math.round(dr.top  - rect.top  + dr.height/2);
            console.log(`  connector [${dot.dataset.name}] flow=${dot.dataset.flow} dir=${dot.dataset.direction}  x=${cx} y=${cy}`);
        });
    });
    // Schematic container selbst
    console.log(`[layout] SCH: offsetWidth=${SCH.offsetWidth} offsetHeight=${SCH.offsetHeight} rect w=${Math.round(rect.width)} h=${Math.round(rect.height)}`);
});

// ── Signalverbindungen ───────────────────────────────────────────────────────

// setpoint.out → sum.in1
setpoint.connect('out', { setParam(k, v) { sum.setInput('in1', v); } }, 'dummy');
// pi.out → pt1.in
pi.connect('out', { setParam(k, v) { pt1.setInput('in', v); } }, 'dummy');
// sum.out → pi.in
sum.connect('out', { setParam(k, v) { pi.setInput('in', v); } }, 'dummy');
// pt1.out → sum.in2 (Rückführung, negatives Vorzeichen im SumBlock)
pt1.connect('out', { setParam(k, v) { sum.setInput('in2', v); } }, 'dummy');

// ── Simulation ───────────────────────────────────────────────────────────────

// Reihenfolge wichtig: setpoint → sum → pi → pt1
const sim = new signalSim([setpoint, sum, pi, pt1], { dt: DT });

// ── Plot-Daten ────────────────────────────────────────────────────────────────

const HISTORY = 10;  // Sekunden sichtbar
const data = { t: [], w: [], y: [], u: [] };

sim.onStep((s) => {
    const t = s.t;
    data.t.push(t);
    data.w.push(setpoint.outputs.out ?? 0);
    data.y.push(pt1.outputs.out      ?? 0);
    data.u.push(pi.outputs.out       ?? 0);
    // Alte Daten abschneiden
    const cutoff = t - HISTORY;
    while (data.t[0] < cutoff) {
        data.t.shift(); data.w.shift(); data.y.shift(); data.u.shift();
    }
    document.getElementById('t-display').textContent = `t = ${t.toFixed(3)} s`;
});

// ── Zeichnen (alle 300 ms) ────────────────────────────────────────────────────

const canvas = document.getElementById('plot-canvas');
const ctx    = canvas.getContext('2d');

function resizeCanvas() {
    canvas.width  = canvas.offsetWidth  * devicePixelRatio;
    canvas.height = canvas.offsetHeight * devicePixelRatio;
}
new ResizeObserver(resizeCanvas).observe(canvas);
resizeCanvas();

function drawPlot() {
    const W  = canvas.width;
    const H  = canvas.height;
    const dpr = devicePixelRatio;
    ctx.clearRect(0, 0, W, H);

    if (data.t.length < 2) return;

    const PAD = { top: 20*dpr, right: 20*dpr, bottom: 32*dpr, left: 52*dpr };
    const pw  = W - PAD.left - PAD.right;
    const ph  = H - PAD.top  - PAD.bottom;

    // Achsengrenzen
    const tMax  = data.t[data.t.length - 1];
    const tMin  = tMax - HISTORY;
    const allY  = [...data.w, ...data.y, ...data.u];
    const yMin  = Math.min(...allY) - 0.15;
    const yMax  = Math.max(...allY) + 0.15;
    const yRange = yMax - yMin || 1;

    const tx = t  => PAD.left + (t - tMin)  / HISTORY * pw;
    const ty = y  => PAD.top  + (1 - (y - yMin) / yRange) * ph;

    // Hintergrund
    ctx.fillStyle = '#12121f';
    ctx.fillRect(0, 0, W, H);

    // Gitter
    ctx.strokeStyle = '#1e1e3a';
    ctx.lineWidth   = 1;
    for (let i = 0; i <= 5; i++) {
        const yv = yMin + (yRange * i / 5);
        const yp = ty(yv);
        ctx.beginPath(); ctx.moveTo(PAD.left, yp); ctx.lineTo(W - PAD.right, yp); ctx.stroke();
        ctx.fillStyle   = '#444';
        ctx.font        = `${10*dpr}px sans-serif`;
        ctx.textAlign   = 'right';
        ctx.fillText(yv.toFixed(2), PAD.left - 6*dpr, yp + 4*dpr);
    }
    // Zeitachse
    for (let dt2 = 0; dt2 <= HISTORY; dt2 += 2) {
        const xp = tx(tMin + dt2);
        ctx.beginPath(); ctx.moveTo(xp, PAD.top); ctx.lineTo(xp, H - PAD.bottom); ctx.stroke();
        ctx.fillStyle = '#444';
        ctx.textAlign = 'center';
        ctx.fillText(`${(tMin + dt2).toFixed(0)}s`, xp, H - PAD.bottom + 16*dpr);
    }

    // Nulllinie
    if (yMin < 0 && yMax > 0) {
        ctx.strokeStyle = '#333';
        ctx.lineWidth   = 1;
        ctx.setLineDash([4*dpr, 4*dpr]);
        ctx.beginPath(); ctx.moveTo(PAD.left, ty(0)); ctx.lineTo(W - PAD.right, ty(0)); ctx.stroke();
        ctx.setLineDash([]);
    }

    // Sprungzeitpunkt
    const jumpT = setpoint.getParam('jumpTime');
    if (jumpT >= tMin && jumpT <= tMax) {
        ctx.strokeStyle = '#3a3a2a';
        ctx.lineWidth   = 1;
        ctx.setLineDash([3*dpr, 5*dpr]);
        ctx.beginPath(); ctx.moveTo(tx(jumpT), PAD.top); ctx.lineTo(tx(jumpT), H - PAD.bottom); ctx.stroke();
        ctx.setLineDash([]);
    }

    // Kurven zeichnen
    const series = [
        { values: data.w, color: '#f0c040', lw: 1.5 },
        { values: data.y, color: '#60c0ff', lw: 2   },
        { values: data.u, color: '#c084fc', lw: 1.5 },
    ];
    series.forEach(({ values, color, lw }) => {
        ctx.beginPath();
        ctx.strokeStyle = color;
        ctx.lineWidth   = lw * dpr;
        ctx.lineJoin    = 'round';
        data.t.forEach((t2, i) => {
            const x = tx(t2);
            const y2 = ty(values[i]);
            i === 0 ? ctx.moveTo(x, y2) : ctx.lineTo(x, y2);
        });
        ctx.stroke();
    });

    // Achsenrahmen
    ctx.strokeStyle = '#2a2a4a';
    ctx.lineWidth   = 1;
    ctx.strokeRect(PAD.left, PAD.top, pw, ph);
}

setInterval(drawPlot, 300);

// ── Leitungen via ElectricalWire ────────────────────────────────────────────

function drawWires() {
    const connectors = [
        ...setpoint.getConnectorPositions(SCH, 'sp'),
        ...sum.getConnectorPositions(SCH,      'sum'),
        ...pi.getConnectorPositions(SCH,       'pi'),
        ...pt1.getConnectorPositions(SCH,      'pt1'),
    ];

    const connections = [
        { id: 'w-sp-sum',  from: 'sp.out',  to: 'sum.in1' },  // Sollwert → Σ
        { id: 'w-sum-pi',  from: 'sum.out', to: 'pi.in'   },  // Σ → PI
        { id: 'w-pi-pt1',  from: 'pi.out',  to: 'pt1.in'  },  // PI → PT1
        { id: 'w-pt1-sum', from: 'pt1.out', to: 'sum.in2' },  // PT1 → Σ (Rückführung)
    ];

    const blocked = [setpoint, sum, pi, pt1].map(b => b.getImageDiv());

    try {
        const wire = new SignalWire(SCH, {
            gridSize: 10, wireColor: '#7c3db0', wireWidth: 1.5, logging: false,
        });
        wire.setConnectors(connectors);
        wire.setConnections(connections);
        wire.setBlockedAreas(blocked, { shrink: 5 });
        wire.render();
    } catch(e) {
        console.error('Wire routing Fehler:', e.message);
    }
}

// ── Steuerung ────────────────────────────────────────────────────────────────

let running = true;
sim.start();

document.getElementById('btn-start').addEventListener('click', () => {
    running = !running;
    const btn = document.getElementById('btn-start');
    if (running) { sim.start(); btn.textContent = '⏵ Läuft'; btn.classList.add('active'); }
    else         { sim.stop();  btn.textContent = '⏸ Pause'; btn.classList.remove('active'); }
});

document.getElementById('btn-reset').addEventListener('click', () => {
    sim.stop();
    sim._t = 0;
    setpoint._t = 0;
    pi._integral = 0;
    pt1._state = 0;
    [setpoint, sum, pi, pt1].forEach(b => { b.inputs = {}; b.outputs = {}; });
    data.t.length = 0; data.w.length = 0; data.y.length = 0; data.u.length = 0;
    document.getElementById('t-display').textContent = 't = 0.000 s';
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if (running) sim.start();
});

// Param-Inputs
document.getElementById('in-kp').addEventListener('change', e => pi.setParam('kp', +e.target.value));
document.getElementById('in-ki').addEventListener('change', e => pi.setParam('ki', +e.target.value));
document.getElementById('in-T' ).addEventListener('change', e => pt1.setParam('T', +e.target.value));
document.getElementById('in-w0').addEventListener('change', e => setpoint.setParam('value0', +e.target.value));
document.getElementById('in-w1').addEventListener('change', e => setpoint.setParam('value1', +e.target.value));

// Leitungen nach dem ersten Render
requestAnimationFrame(() => requestAnimationFrame(drawWires));
</script>
</body>
</html>
