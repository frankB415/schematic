<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Lastfluss Demo7 — AC + DC Last parallel</title>
<link rel="stylesheet" href="/schematic/schematicBlock/schematicBlock.css">
<link rel="stylesheet" href="/schematic/demo.css">
</head>
<body>

<h1>Lastfluss Demo7 — Quelle · Trafo · WiderstandsLast ∥ Last</h1>
<p class="subtitle">
  k1: Quelle 400V &nbsp;|&nbsp;
  k2: Trafo-Sek + WiderstandsLast (50kW) + Last (20kW, 180..260V)
</p>

<div id="schematic" style="width:600px; height:440px;"></div>
<div id="log"></div>

<script src="/schematic/schematicBlock/schematicBlock.js"></script>
<script src="/schematic/labeledBlock/labeledBlock.js"></script>
<script src="/electricalWire/electricalWire.js"></script>
<script src="/schematic/lastflussBlock/wireBlocks.js"></script>
<script src="/schematic/lastflussBlock/lastflussBlock.js"></script>
<script src="/schematic/lastflussBlock/last.js"></script>
<script src="/schematic/lastflussKomplexBlock/lastflussKomplexBlock.js"></script>
<script src="/schematic/lastflussKomplexBlock/spannungsquelle.js"></script>
<script src="/schematic/lastflussKomplexBlock/trafo.js"></script>
<script src="/schematic/lastflussKomplexBlock/widerstandsLast.js"></script>
<script src="/schematic/simulator/baseSim.js"></script>
<script src="/schematic/simulator/nodeBaseSim.js"></script>
<script src="/schematic/simulator/lastflussKomplexSim.js"></script>

<script>
const logEl = document.getElementById('log');
function log(msg, cls = '') {
    const d = document.createElement('div');
    if (cls) d.className = cls;
    d.textContent = msg;
    logEl.appendChild(d);
    logEl.scrollTop = logEl.scrollHeight;
    console.log((cls ? `[${cls}] ` : '') + msg);
}

// ── Blöcke ───────────────────────────────────────────────────────────────────
//
//  [Quelle]         x=200, y=60
//       | k1
//  [Trafo]          x=200, y=190
//       | k2
//  [WiderstandsLast]  x=120, y=340
//  [Last]             x=280, y=340

const quelle  = new Spannungsquelle('Quelle', { uNom: 400, skNom: 5e6, x: 200, y: 60  });
const trafo   = new Trafo('TR1',  { u1Nenn: 400, u2Nenn: 230, sNenn: 100e3, uk: 4, x: 200, y: 190 });
const wLast   = new WiderstandsLast('R-Last', { uNenn: 230, pNom: 50e3, x: 120, y: 340 });
const last    = new Last('Last', { pNom: 20e3, uMin: 180, uMax: 260, x: 420, y: 340 });

const schematic = document.getElementById('schematic');
[quelle, trafo, wLast, last].forEach(b => b.render(schematic));
const blocks = [quelle, trafo, wLast, last];

const connections = [
    { id: 'k1',      from: 'Quelle.out', to: 'TR1.in',     uMin: 350, uMax: 450 },
    { id: 'k2',      from: 'TR1.out',    to: 'R-Last.in',  uMin: 180, uMax: 280 },
    { id: 'k2',      from: 'TR1.out',    to: 'Last.in',    uMin: 180, uMax: 280 },
];

const sim = new lastflussKomplexSim(blocks, connections, { epsilon: 100, scanSteps: 8, logging: true });

// ── Simulation ───────────────────────────────────────────────────────────────

requestAnimationFrame(() => {

    // ── Wires ─────────────────────────────────────────────────────────────────
    try {
        wireBlocks(schematic, blocks, connections, { wireColor: '#a0c0ff' });
        log('Routing OK');
    } catch(e) { log(`Routing Fehler: ${e.message}`, 'err'); }

    // ── Solve ─────────────────────────────────────────────────────────────────
    try {
        const { voltages, converged, iterations } = sim.solve();
        const k1 = voltages.get('k1');
        const k2 = voltages.get('k2');
        const fmt = v => {
            if (!v) return '?';
            const abs = Math.sqrt(v.re**2 + v.im**2) / 1000;
            const phi = Math.atan2(v.im, v.re) * 180 / Math.PI;
            return `${abs.toFixed(3)} kV ∠ ${phi.toFixed(1)}°`;
        };
        log(`${converged ? '✓' : '⚠'} Konvergenz nach ${iterations} Iterationen`, converged ? '' : 'warn');
        log(`k1: U = ${fmt(k1)}`);
        log(`k2: U = ${fmt(k2)}`);
        log('── Blockergebnisse ──');
        [['Quelle', quelle], ['Trafo', trafo], ['R-Last', wLast], ['Last', last]].forEach(([name, block]) => {
            log(`${name}:`);
            Object.entries(block.results || {}).forEach(([key, val]) => {
                const fmt2 = block._resultFormats?.[key];
                log(`  ${fmt2 ? fmt2(val) : key + ': ' + JSON.stringify(val)}`);
            });
        });
    } catch(e) {
        log(`Solver Fehler: ${e.message}`, 'err');
        console.error(e);
    }
});
</script>
</body>
</html>
