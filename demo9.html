<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Lastfluss Demo9 — Q3 · 2× Trafo-Gleichrichter · DC-Last</title>
<link rel="stylesheet" href="/schematic/schematicBlock/schematicBlock.css">
<link rel="stylesheet" href="/schematic/demo.css">
</head>
<body>

<h1>Lastfluss Demo9 — Q3 · 2× Trafo-Gleichrichter · DC-Last</h1>
<p class="subtitle">
  k_ac: Spannungsquelle 20kV L-L, 50MVA &nbsp;|&nbsp;
  k_dc: gemeinsamer DC-Knoten (~796V) &nbsp;|&nbsp;
  Topologie: Y (eine Quelle, zwei Gleichrichter, eine Last)
</p>

<!--
  Layout (Y-Topologie):

  [Quelle1]  x=100,y=60      [Quelle2]  x=300,y=60
      | k1                        | k2
  [TR-GR1]  x=100,y=200      [TR-GR2]  x=300,y=200
      \         k_dc              /
       ─────────┬─────────────────
                |
             [Last]  x=200,y=380
-->
<div id="schematic" style="width:700px; height:520px; position: relative;"></div>
<div id="log"></div>

<script src="/schematic/schematicBlock/schematicBlock.js"></script>
<script src="/schematic/labeledBlock/labeledBlock.js"></script>
<script src="/electricalWire/electricalWire.js"></script>
<script src="/schematic/lastflussBlock/wireBlocks.js"></script>
<script src="/schematic/lastflussBlock/lastflussBlock.js"></script>
<script src="/schematic/lastflussBlock/last.js"></script>
<script src="/schematic/lastflussKomplexBlock/lastflussKomplexBlock.js"></script>
<script src="/schematic/lastflussKomplexBlock/spannungsquelle.js"></script>
<script src="/schematic/lastflussKomplexBlock/trafoGleichrichter.js"></script>
<script src="/schematic/simulator/baseSim.js"></script>
<script src="/schematic/simulator/nodeBaseSim.js"></script>
<script src="/schematic/simulator/lastflussKomplexSim.js"></script>

<script>

const logEl = document.getElementById('log');
function log(msg, cls = '') {
    const d = document.createElement('div');
    if (cls) d.className = cls;
    d.textContent = msg;
    logEl.appendChild(d);
    logEl.scrollTop = logEl.scrollHeight;
}

// ── Blöcke ───────────────────────────────────────────────────────────────────

// Gemeinsame AC-Quelle 20kV
const quelle3 = new Spannungsquelle('Q3', {
    uNom: 20000, skNom: 50e6,
    x: 300, y: 40,
});

// Zwei Trafo-Gleichrichter 20kV/590V, je 1.2MVA → vDc0 = 590*1.35 = 796V
const trafoGr1 = new TrafoGleichrichter('TR-GR1', {
    u1Nenn: 20000, u2Nenn: 590, sNenn: 1.2e6, uk: 4,
    x: 150, y: 200,
});

const trafoGr2 = new TrafoGleichrichter('TR-GR2', {
    u1Nenn: 20000, u2Nenn: 590, sNenn: 1.2e6, uk: 6,
    x: 500, y: 200,
});

// DC-Last: 2MW, aktiv 720–800V
const last = new Last('Last', {
    pNom: 2e6, uMin: 720, uMax: 800,
    x: 300, y: 400,
});

// ── Render ───────────────────────────────────────────────────────────────────
const schematic = document.getElementById('schematic');
quelle3.render(schematic);
trafoGr1.render(schematic);
trafoGr2.render(schematic);
last.render(schematic);

// ── Simulation ───────────────────────────────────────────────────────────────
//
//  k_ac — AC-Knoten: Q3 + TR-GR1(in) + TR-GR2(in)   20kV
//  k_dc — DC-Knoten: TR-GR1(out) + TR-GR2(out) + Last(in)  ~796V
//
const blocks = [quelle3, trafoGr1, trafoGr2, last];

const connections = [
    { id: 'k_ac', from: 'Q3.out',      to: 'TR-GR1.in',  uMin: 18000, uMax: 22000 },
    { id: 'k_ac', from: 'Q3.out',      to: 'TR-GR2.in',  uMin: 18000, uMax: 22000 },
    { id: 'k_dc', from: 'TR-GR1.out',  to: 'Last.in',    uMin: 700,   uMax: 820   },
    { id: 'k_dc', from: 'TR-GR2.out',  to: 'Last.in',    uMin: 700,   uMax: 820   },
];

const sim = new lastflussKomplexSim(blocks, connections, { epsilon: 50, scanSteps: 10, logging: true, timing: true });

requestAnimationFrame(() => {

    // ── Wires ─────────────────────────────────────────────────────────────────
    try {
        console.log('[demo9] vor wireBlocks');
        wireBlocks(schematic, blocks, connections);
        log('Routing OK');
    } catch(e) {
        log(`Routing Fehler: ${e.message}`, 'err');
        console.error('[demo9] wireBlocks Fehler:', e);
    }

    // ── Solve ─────────────────────────────────────────────────────────────────
    console.log('[demo9] vor solve — nodes:', sim._nodes?.map(n => n.id + ':' + n.blocks.map(b=>b._label).join(',')));
    console.log('[demo9] logging:', sim._logging, 'epsilon:', sim._epsilon);
    try {
        console.log('[demo9] solve() start');
        const result = sim.solve();
        console.log('[demo9] solve() done', result);
        log(`${result.converged ? '✓' : '⚠'} Konvergenz nach ${result.iterations} Iterationen`, result.converged ? '' : 'warn');
    } catch(e) {
        console.error('[demo9] solve() Fehler:', e);
        log(`Solver Fehler: ${e.message}`, 'err');
        console.error(e);
    }
});

</script>
</body>
</html>
