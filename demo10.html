<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Lastfluss Demo10 — 20kV Quelle · Kabel · Trafo-Gleichrichter · DC-Last 1MW</title>
<link rel="stylesheet" href="/schematic/schematicBlock/schematicBlock.css">
<link rel="stylesheet" href="/schematic/demo.css">
</head>
<body>

<h1>Lastfluss Demo10 — 20kV Quelle · Kabel · Trafo-Gleichrichter · DC-Last</h1>
<p class="subtitle">
  k1: Spannungsquelle 20kV L-L &nbsp;|&nbsp;
  k2: AC nach Kabel &nbsp;|&nbsp;
  k_dc: DC-Knoten (Gleichrichterausgang) &nbsp;|&nbsp;
  Last: 1MW DC
</p>

<!--
  Layout (vertikal, zentriert):

  [Quelle]      x=170, y=50    — 20kV, 100MVA
       | k1
  [Kabel]       x=170, y=160   — 1km, 150mm², 20kV
       | k2
  [TrafoGR]     x=170, y=310   — 20kV/400V, 1.2MVA
       | k_dc
  [Last]        x=170, y=470   — 1MW DC
-->
<div id="schematic" style="width:400px; height:680px; position: relative;"></div>
<div id="log"></div>

<script src="/schematic/schematicBlock/schematicBlock.js"></script>
<script src="/schematic/labeledBlock/labeledBlock.js"></script>
<script src="/electricalWire/electricalWire.js"></script>
<script src="/schematic/lastflussBlock/lastflussBlock.js"></script>
<script src="/schematic/lastflussBlock/last.js"></script>
<script src="/schematic/lastflussKomplexBlock/lastflussKomplexBlock.js"></script>
<script src="/schematic/lastflussKomplexBlock/spannungsquelle.js"></script>
<script src="/schematic/lastflussKomplexBlock/acKabel.js"></script>
<script src="/schematic/lastflussKomplexBlock/trafoGleichrichter.js"></script>
<script src="/schematic/simulator/baseSim.js"></script>
<script src="/schematic/simulator/nodeBaseSim.js"></script>
<script src="/schematic/simulator/lastflussSim.js"></script>
<script src="/schematic/simulator/lastflussKomplexSim.js"></script>

<script>

const logEl = document.getElementById('log');
function log(msg, cls = '') {
    const d = document.createElement('div');
    if (cls) d.className = cls;
    d.textContent = msg;
    logEl.appendChild(d);
    logEl.scrollTop = logEl.scrollHeight;
}

// ── Blöcke ───────────────────────────────────────────────────────────────────

const quelle = new Spannungsquelle('Quelle', {
    uNom: 20000, skNom: 100e6,
    x: 170, y: 50,
});

// 1km, 150mm², 20kV XLPE
const kabel = new ACKabel('ACKabel', {
    laenge: 20, quer: 70, uNenn: 20000,
    x: 170, y: 170,
});

// Trafo: 20kV → 400V, 1.2MVA, uk=6%
const trafoGr = new TrafoGleichrichter('TR-GR', {
    u1Nenn: 20000, u2Nenn: 400, sNenn: 1.2e6, ukPct: 6,
    x: 170, y: 340,
});

// DC-Last: 1MW, aktiv 480–560V (400V·1.35 = 540V Leerlauf)
const last = new Last('Last', {
    pNom: 1e6, uMin: 480, uMax: 540,
    x: 170, y: 510,
});

// ── Render ───────────────────────────────────────────────────────────────────
const schematic = document.getElementById('schematic');
quelle.render(schematic);
kabel.render(schematic);
trafoGr.render(schematic);
last.render(schematic);

// ── Simulation ───────────────────────────────────────────────────────────────
//
//  k1   — AC 20kV: Quelle + Kabel(in)
//  k2   — AC nach Kabel: Kabel(out) + TrafoGR(in)
//  k_dc — DC: TrafoGR(out) + Last(in)
//
const sim = new lastflussKomplexSim([
    { id: 'k1',   blocks: [quelle, kabel],    uMin: 19500, uMax: 20500 },
    { id: 'k2',   blocks: [kabel, trafoGr],   uMin: 19000, uMax: 20500 },
    { id: 'k_dc', blocks: [trafoGr, last],    uMin: 400,   uMax: 530   },
], { epsilon: 100, scanSteps: 8, logging: true });

requestAnimationFrame(() => {

    // ── Wires ─────────────────────────────────────────────────────────────────
    const connectors = [
        ...quelle.getConnectorPositions(schematic,  'quelle'),
        ...kabel.getConnectorPositions(schematic,   'kabel'),
        ...trafoGr.getConnectorPositions(schematic, 'trafogr'),
        ...last.getConnectorPositions(schematic,    'last'),
    ];

    const connections = [
        { id: 'k1',   from: 'quelle.out',  to: 'kabel.in'    },
        { id: 'k2',   from: 'kabel.out',   to: 'trafogr.in'  },
        { id: 'k_dc', from: 'trafogr.out', to: 'last.in'     },
    ];

    const blocked = [quelle, kabel, trafoGr, last].map(b => b.getImageDiv());

    try {
        const wire = new ElectricalWire(schematic, {
            gridSize: 10, wireColor: '#a0c0ff', wireWidth: 1.5,
        });
        wire.setConnectors(connectors);
        wire.setConnections(connections);
        wire.setBlockedAreas(blocked, { shrink: 5 });
        wire.render();
        log('Routing OK');
    } catch(e) {
        log(`Routing Fehler: ${e.message}`, 'err');
    }

    // ── Solve ─────────────────────────────────────────────────────────────────
    try {
        const { voltages, converged, iterations } = sim.solve();

        const fmtAC = v => {
            if (!v) return '?';
            const abs = Math.sqrt(v.re**2 + v.im**2) / 1000;
            const phi = Math.atan2(v.im, v.re) * 180 / Math.PI;
            return `${abs.toFixed(3)} kV ∠ ${phi.toFixed(1)}°`;
        };
        const fmtDC = v => v == null ? '?' : `${(+v).toFixed(1)} V`;

        log(`${converged ? '✓' : '⚠'} Konvergenz nach ${iterations} Iterationen`, converged ? '' : 'warn');
        log(`k1   (20kV):  U = ${fmtAC(voltages.get('k1'))}`);
        log(`k2   (n. Kabel): U = ${fmtAC(voltages.get('k2'))}`);
        log(`k_dc (DC):    U = ${fmtDC(voltages.get('k_dc'))}`);

        log('── Blockergebnisse ──');
        [
            ['Quelle',         quelle],
            ['Kabel',          kabel],
            ['Trafo-Gleichr.', trafoGr],
            ['Last (DC)',       last],
        ].forEach(([name, block]) => {
            log(`${name}:`);
            Object.entries(block.results || {}).forEach(([key, val]) => {
                const fmt = block._resultFormats?.[key];
                log(`  ${fmt ? fmt(val) : JSON.stringify(val)}`);
            });
        });
    } catch(e) {
        log(`Solver Fehler: ${e.message}`, 'err');
        console.error(e);
    }
});

</script>
</body>
</html>
