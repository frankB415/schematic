<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Lastfluss Demo8 — Trafo-Gleichrichter + DC-Last</title>
<link rel="stylesheet" href="/schematic/schematicBlock/schematicBlock.css">
<link rel="stylesheet" href="/schematic/demo.css">
</head>
<body>

<h1>Lastfluss Demo8 — AC Quelle · Trafo-Gleichrichter · DC-Last</h1>
<p class="subtitle">
  k1: Spannungsquelle 400V L-L &nbsp;|&nbsp;
  k_dc: DC-Knoten (Gleichrichterausgang ~310V) &nbsp;|&nbsp;
  Dreiphasen-Brückengleichrichter: vDc = |v2| · 1.35
</p>

<div id="schematic" style="width:400px; height:480px;"></div>
<div id="log"></div>

<script src="/schematic/schematicBlock/schematicBlock.js"></script>
<script src="/schematic/labeledBlock/labeledBlock.js"></script>
<script src="/electricalWire/electricalWire.js"></script>
<script src="/schematic/lastflussBlock/lastflussBlock.js"></script>
<script src="/schematic/lastflussBlock/last.js"></script>
<script src="/schematic/lastflussKomplexBlock/lastflussKomplexBlock.js"></script>
<script src="/schematic/lastflussKomplexBlock/spannungsquelle.js"></script>
<script src="/schematic/lastflussKomplexBlock/trafoGleichrichter.js"></script>
<script src="/schematic/simulator/baseSim.js"></script>
<script src="/schematic/simulator/nodeBaseSim.js"></script>
<script src="/schematic/simulator/lastflussSim.js"></script>
<script src="/schematic/simulator/lastflussKomplexSim.js"></script>

<script>

const logEl = document.getElementById('log');
function log(msg, cls = '') {
    const d = document.createElement('div');
    if (cls) d.className = cls;
    d.textContent = msg;
    logEl.appendChild(d);
    logEl.scrollTop = logEl.scrollHeight;
}

// ── Blöcke ───────────────────────────────────────────────────────────────────
//
//  Layout (vertikal, zentriert):
//
//  [Spannungsquelle]    x=170, y=60
//         | k1 (AC, 400V L-L)
//  [TrafoGleichrichter] x=170, y=200   (100px hoch)
//         | k_dc (~310V DC)
//  [Last]               x=170, y=380
//

const quelle = new Spannungsquelle('Quelle', {
    uNom: 400, skNom: 5e6,
    x: 170, y: 60,
});

const trafoGr = new TrafoGleichrichter('TR-GR', {
    u1Nenn: 400, u2Nenn: 230, sNenn: 100e3, ukPct: 4, pNom: 20e3,
    x: 170, y: 200,
});

// DC-Last: 20kW, aktiv zwischen 280V und 340V
const last = new Last('Last', {
    pNom: 20e3, uMin: 280, uMax: 340,
    x: 170, y: 380,
});

// ── Render ───────────────────────────────────────────────────────────────────
const schematic = document.getElementById('schematic');
quelle.render(schematic);
trafoGr.render(schematic);
last.render(schematic);

// ── Simulation ───────────────────────────────────────────────────────────────
//
//  k1   — AC-Knoten: Quelle + TrafoGleichrichter (in)
//  k_dc — DC-Knoten: TrafoGleichrichter (out) + Last (in)
//
const sim = new lastflussKomplexSim([
    { id: 'k1',   blocks: [quelle, trafoGr],  uMin: 350,  uMax: 450  },
    { id: 'k_dc', blocks: [trafoGr, last],    uMin: 100,  uMax: 310  },  // uMax < vDcIdeal (230*1.35=310V)
], { epsilon: 50, scanSteps: 8, logging: true });

requestAnimationFrame(() => {

    // ── Wires ─────────────────────────────────────────────────────────────────
    const connectors = [
        ...quelle.getConnectorPositions(schematic,  'quelle'),
        ...trafoGr.getConnectorPositions(schematic, 'trafogr'),
        ...last.getConnectorPositions(schematic,    'last'),
    ];

    const connections = [
        { id: 'k1',   from: 'quelle.out',  to: 'trafogr.in'  },
        { id: 'k_dc', from: 'trafogr.out', to: 'last.in'      },
    ];

    const blocked = [quelle, trafoGr, last].map(b => b.getImageDiv());

    try {
        const wire = new ElectricalWire(schematic, {
            gridSize: 10, wireColor: '#a0c0ff', wireWidth: 1.5,
        });
        wire.setConnectors(connectors);
        wire.setConnections(connections);
        wire.setBlockedAreas(blocked, { shrink: 5 });
        wire.render();
        log('Routing OK');
    } catch(e) {
        log(`Routing Fehler: ${e.message}`, 'err');
    }

    // ── Solve ─────────────────────────────────────────────────────────────────
    try {
        const { voltages, converged, iterations } = sim.solve();

        const k1  = voltages.get('k1');
        const kDc = voltages.get('k_dc');

        const fmtAC = v => {
            if (!v) return '?';
            const abs = Math.sqrt(v.re**2 + v.im**2) / 1000;
            const phi = Math.atan2(v.im, v.re) * 180 / Math.PI;
            return `${abs.toFixed(3)} kV ∠ ${phi.toFixed(1)}°`;
        };
        const fmtDC = v => {
            if (v == null) return '?';
            return typeof v === 'number'
                ? `${v.toFixed(1)} V`
                : `${Math.sqrt(v.re**2 + v.im**2).toFixed(1)} V`;
        };

        log(`${converged ? '✓' : '⚠'} Konvergenz nach ${iterations} Iterationen`, converged ? '' : 'warn');
        log(`k1  (AC-Primär): U = ${fmtAC(k1)}`);
        log(`k_dc (DC-Ausgang): U = ${fmtDC(kDc)}`);

        // Block-Ergebnisse
        log('── Blockergebnisse ──');
        [
            ['Quelle',          quelle],
            ['Trafo-Gleichr.', trafoGr],
            ['Last (DC)',        last],
        ].forEach(([name, block]) => {
            log(`${name}:`);
            Object.entries(block.results || {}).forEach(([key, val]) => {
                const fmt2 = block._resultFormats?.[key];
                const str  = fmt2 ? fmt2(val) : JSON.stringify(val);
                log(`  ${str}`);
            });
        });
    } catch(e) {
        log(`Solver Fehler: ${e.message}`, 'err');
        console.error(e);
    }
});

</script>
</body>
</html>
